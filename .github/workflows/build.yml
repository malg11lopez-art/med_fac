name: Build MEDIEVAL FACTIONS

on:
  push:
    paths:
      - 'MEDIEVAL_FACTIONS_v0_9_*_alpha.zip'
      - 'ci/apply_build_patches.py'
      - 'ci/verify_mod_jar.sh'
      - 'ci/smoke_server_start.sh'
      - 'ci/smoke_client_start.sh'
      - 'ci/smoke_multiplayer_join.sh'
      - 'ci/feature_patch/**'
      - 'ci/overlays/**'
      - 'ci/phase2_src/**'
      - 'ci/verify_sound_preview.py'
      - 'ci/verify_skin_sync.py'
      - 'ci/quality_patch/**'
      - 'ci/patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medieval-factions-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build mod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'MEDIEVAL_FACTIONS_v0_9_*_alpha.zip' -print | sort -V | tail -n 1)"
          ARCHIVE="${ARCHIVE#./}"
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No MEDIEVAL_FACTIONS_v0_9_*_alpha.zip source archive found in repository root."
            exit 1
          fi
          echo "Using source archive: $ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p build-input
          unzip -q "$ARCHIVE" -d build-input
          PROJECT_DIR="$(find build-input -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle" ] || [ ! -d "$PROJECT_DIR/src/main" ]; then
            echo "::error::The archive does not contain the expected Gradle project."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply NeoForge 1.21.1 compile fixes
        run: python ci/apply_build_patches.py "${{ steps.archive.outputs.project_dir }}"
      - name: Export the patched source snapshot for phase implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.archive.outputs.project_dir }}"
          SNAPSHOT_DIR="$RUNNER_TEMP/medieval-factions-phase2-source"
          mkdir -p "$SNAPSHOT_DIR"
          rsync -a \
            --exclude build/ \
            --exclude .gradle/ \
            --exclude .idea/ \
            --exclude .github/ \
            --exclude .git/ \
            "$PROJECT_DIR/" "$SNAPSHOT_DIR/"
          git -C "$SNAPSHOT_DIR" init
          git -C "$SNAPSHOT_DIR" config user.name "github-actions[bot]"
          git -C "$SNAPSHOT_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SNAPSHOT_DIR" add -A
          git -C "$SNAPSHOT_DIR" commit -m "build: export patched source snapshot for phase implementation"
          git -C "$SNAPSHOT_DIR" push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/work/phase2-source-snapshot

      - name: Upload patched source snapshot for QA
        uses: actions/upload-artifact@v4
        with:
          name: medieval-factions-source-${{ github.sha }}
          path: ${{ steps.archive.outputs.project_dir }}/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg for complete OGG validation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install resource-validator dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate resources
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: python tools/validate_assets.py

      - name: Verify all SoundEvents are auditionable
        run: python ci/verify_sound_preview.py "${{ steps.archive.outputs.project_dir }}"
      - name: Verify multiplayer player skin synchronization
        run: python ci/verify_skin_sync.py "${{ steps.archive.outputs.project_dir }}"

      - name: Run domain tests
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash tools/run_domain_tests.sh

      - name: Run SavedData stub tests
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash tools/run_saveddata_stub_tests.sh

      - name: Compile and test NeoForge mod
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: gradle --no-daemon clean test build

      - name: Run NeoForge GameTests
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: gradle --no-daemon runGameTestServer

      - name: Verify mod descriptor and JAR integrity
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash "$GITHUB_WORKSPACE/ci/verify_mod_jar.sh"

      - name: Boot dedicated NeoForge server (smoke test)
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash "$GITHUB_WORKSPACE/ci/smoke_server_start.sh"

      - name: Boot headless Minecraft client and reload assets
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash "$GITHUB_WORKSPACE/ci/smoke_client_start.sh"
      - name: Verify live client/server join and skin packet round-trip
        working-directory: ${{ steps.archive.outputs.project_dir }}
        run: bash "$GITHUB_WORKSPACE/ci/smoke_multiplayer_join.sh"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: medieval-factions-jar-${{ github.sha }}
          path: ${{ steps.archive.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
